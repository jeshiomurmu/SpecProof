repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Generated artifacts must stay byte-identical to pipeline output (manifest hashes).
      - id: ruff
        exclude: ^artifacts/
      - id: ruff-format
        exclude: ^artifacts/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
