name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Setup
        run: make setup
      - name: Check
        run: make check
