# FX-01: synthetic 7-page spec (docs/TEST_PLAN.md section 2).
# Plain lines are drawn at x=72; each leading space shifts the line 5pt right.
# Lines starting with "|" are table rows; cells go to the fixed columns in build_synthetic_pdf.py.
footer: "Widget API Reference"
pages:
  - - "Contents"
    - ""
    - "1.1 Overview ................................................ 2"
    - "2.1 Schemas ................................................. 3"
    - "2.2 Create Widget ........................................... 4"
    - "2.3 Fetch Widget ............................................ 6"
    - "2.4 Broken Sample ........................................... 7"
  - - "1.1 Overview"
    - ""
    - "The Widget API manages widgets. All requests use HTTPS and return a JSON envelope"
    - "with the keys code, msg and data."
  - - "2.1 Schemas"
    - ""
    - "| Parameter | Type | Description"
    - "| color | String | Widget color: enum shade {Red,Green,Blue}"
    - "| size | Integer | Widget size in millimetres."
  - - "2.2 Create Widget"
    - ""
    - "Request URL: /api/v1/widgets"
    - "Permission Key: edit:widget"
    - "Method: POST"
    - ""
    - "Request Header"
    - "| Parameter | Required | Type | Description | Example"
    - "| Authorization | T | String | Bearer token. | Bearer wHFmHR******kD6wHg"
    - ""
    - "Request Body"
    - "| Parameter | Required | Type | Description | Example"
    - "| name | T | String | Name of the widget. | Bolt"
    - "| color | T | String | Color, see 2.1. | Red"
    - "| size | F | Integer | Size in millimetres. | 3"
    - "| notes | F | String | Free-text notes about | fragile"
    - "| | | | the widget. |"
    - ""
    - "Response Sample"
    - "{"
    - "  \"code\": \"SUCCESS\","
    - "  \"msg\": \"success\","
    - "  \"data\": {\"id\": \"w-1\"}"
    - "}"
  - - "Request Sample"
    - "curl '{{host}}/api/v1/widgets'"
    - "  -H 'Authorization: Bearer wHFmHR******kD6wHg'"
    - "  --data-raw '{"
    - "    \"name\": \"Bolt\","
    - "    \"color\": \"Grean\","
    - "    \"size\": 3,"
    - "    \"notes\": \"fragile\""
    - "  }'"
  - - "2.3 Fetch Widget"
    - ""
    - "Request URL: /api/v1/widgets/:id"
    - "Permission Key: view:widget"
    - "Method: GET"
    - ""
    - "Response Body"
    - "| Parameter | Required | Type | Description | Example"
    - "| id | T | String | Widget ID. | w-1"
    - "| name | T | String | Name of the widget. | Bolt"
    - "| color | T | String | Color, see 2.1. | Red"
    - "| size | F | Integer | Size in millimetres. | 3"
    - "| created_at | T | Integer | Creation time. | 1727000000"
    - ""
    - "Response Sample"
    - "{"
    - "  \"code\": \"SUCCESS\","
    - "  \"msg\": \"success\","
    - "  \"data\": {\"id\": \"w-1\", \"name\": \"Bolt\", \"color\": \"Red\", \"created_at\": 1727000000}"
    - "}"
  - - "2.4 Broken Sample"
    - ""
    - "Request URL: /api/v1/widgets"
    - "Permission Key: edit:widget"
    - "Method: DELETE"
    - ""
    - "Request Body"
    - "| Parameter | Required | Type | Description | Example"
    - "| ids | T | Array[String] | Widget IDs to delete. | [\"w-1\"]"
    - ""
    - "Request Sample"
    - "curl -X DELETE '{{host}}/api/v1/widgets'"
    - "  --data-raw '{"
    - "    \"ids\": [\"w-1\"],"
    - "  }'"
