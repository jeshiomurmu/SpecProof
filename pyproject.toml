[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specproof"
version = "0.1.0"
description = "Turn document-only API specs into verified, cited contracts and check code against them."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openapi-spec-validator>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "reportlab>=4.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    "pre-commit>=3.7",
]

[project.scripts]
specproof = "specproof.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specproof = ["report/templates/*.j2", "report/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, pure tests on synthetic inputs",
    "integration: multi-module tests on synthetic fixtures",
    "e2e: full pipeline tests on synthetic fixtures",
    "real_source: needs fetched sources in artifacts/work/ (skipped otherwise)",
]

[tool.coverage.run]
source = ["specproof"]
omit = ["*/specproof/cli.py"]
